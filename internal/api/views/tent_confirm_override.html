{{define "tent_confirm_override.html"}}
<div class="modal-overlay" id="modal-container" hx-swap-oob="true" onclick="this.innerHTML=''">
  <div class="modal-dialog" onclick="event.stopPropagation()">
    <h3>Assign {{.ProfileName}} anyway?</h3>
    <p>This placement violates the tenting rules:
      <ul class="tent-violation-list">
        {{range .Violations}}<li>{{.}}</li>{{end}}
      </ul>
    </p>
    <div class="modal-actions">
      <button class="btn-primary"
        hx-post="/events/{{.EventID}}/tents/override"
        hx-vals='{"profile_id": "{{.ProfileID}}", "tent_id": "{{.TentID}}"}'
        hx-target="#tent-section"
        hx-swap="outerHTML"
        onclick="this.closest('.modal-overlay').remove()">Save Anyway</button>
      <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
    </div>
  </div>
</div>
{{end}}
